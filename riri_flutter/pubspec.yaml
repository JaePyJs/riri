name: riri_flutter
description: "Riri - Gen Z Taglish Reminder & Lifestyle App (Flutter Version)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.3
  drift: ^2.33.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0
  shared_preferences: ^2.5.4
  workmanager: ^0.5.2
  android_alarm_manager_plus: ^3.0.3
  share_plus: ^9.0.0
  google_fonts: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  drift_dev: ^2.33.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/stickers/
