name: riri_flutter
description: "Riri - Gen Z Taglish Reminder & Lifestyle App (Flutter Version)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: 3.3.2-dev.2
  riverpod_annotation: 4.0.3-dev.2
  drift: ^2.33.0
  drift_flutter: ^0.3.0
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.3
  path: ^1.9.0
  shared_preferences: ^2.5.4
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  google_fonts: ^8.1.0
  flutter_animate: ^4.5.2
  confetti: ^0.8.0
  lottie: ^3.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.9
  riverpod_generator: 4.0.4-dev.3
  drift_dev: ^2.33.0
  shared_preferences_platform_interface: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/stickers/
