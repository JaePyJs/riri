name: Flutter Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.7
      - uses: subosito/flutter-action@v2.16.0
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - run: flutter pub get
        working-directory: riri_flutter
      - run: flutter test
        working-directory: riri_flutter
